# The review harnesses [D:harness-wiring] — scheduled, linux-only.
#
# Both are findings-shaped, not gates: they run their probes N times and
# report RATES, because a concurrency or tty finding does not reproduce on
# demand and a green single run proves only that the bug did not happen that
# time. What they DO assert is their own CONTROLS — a probe that cannot fail,
# a ledger that cannot see, an instrument matching its own process — and each
# control exits 1. So a red run here means the INSTRUMENT went blind, which is
# the only thing about them that can be gated honestly.
#
# WHY SCHEDULED AND NOT ON PR: the probes are wall-time assertions over sleeps
# (ceilings measured as widths), which is exactly the shape a loaded shared
# runner makes flaky. Gating PRs on them would train people to re-run CI.
#
# WHY WIRED AT ALL, since nothing is gated: an instrument nobody invokes stops
# working and nobody learns when. Both of these were built by reviews, wired
# to nothing, and unrun for a month — during which the rate one of them exists
# to measure CHANGED (PLAN-concurrency-review F1's nested-overlay loss moved
# from 64-kept to 8-kept when [D:parallel-ladder] reduced the nested ceiling)
# with no one watching. Read the logs; the rates are the output.
name: harnesses

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  harnesses:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-linux-${{ hashFiles('**/*.fsproj') }}
          restore-keys: nuget-linux-
      - name: AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: publish (AOT) + freshness gate
        run: |
          ./publish.sh
          ./ci/check-fresh.sh
      # N is bounded well below each harness's own default (200 / 10): the
      # rates stay readable and the run stays inside the timeout. Raise it by
      # hand on a workflow_dispatch when a rate needs resolution.
      - name: concurrency flake rates (controls gate; rates report)
        run: ./ci/concurrency-flake.sh ~/.local/bin/weir 25
      - name: pty review probes (controls gate; observations report)
        run: ./ci/pty-review.sh ~/.local/bin/weir 5
