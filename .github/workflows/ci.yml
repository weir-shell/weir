name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: codeberg-tiny-lazy
    container:
      image: codeberg.org/queil/weir-ci:latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: dotnet test

      - name: Test again (flake detection)
        run: dotnet test

      - name: Publish AOT
        run: ./publish.sh

      - name: E2E battery (AOT binary)
        run: ./ci/e2e.sh

      - name: Skill-file doc-tests (AOT binary)
        run: ./ci/skill-doc.sh

      - name: F# oracle (fidelity claims vs FCS)
        run: ./ci/fsharp-oracle.sh

      - name: Startup-time regression guard
        run: ./ci/timing.sh
