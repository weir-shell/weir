# The CI matrix [D:github-ci] — the battery ci/local.sh mirrors, grown
# to three platforms. The conflict-marker and freshness gates ride
# ci/e2e.sh and ci/check-fresh.sh on EVERY runner (the uneven-gate
# lesson, per-platform): Windows runs the same bash via Git Bash — one
# gate implementation, never a .ps1 twin.
#
# Expectations, stated so red reads as signal:
# - macos e2e: the GNU-ism sweep finally running with a real signal —
#   first-run reds there are FINDINGS to triage, not flakes.
# - windows unit: STATED SKIPS (POSIX-tool fixtures, the into gap, the
#   shim set) — the Skipped count is the visible list; a NEW skip is a
#   finding. HTTP e2e is the one surface never run on Windows.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-linux-${{ hashFiles('**/*.fsproj') }}
          restore-keys: nuget-linux-
      - name: AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: unit suite (twice — flake detection, the GitLab-parity ritual)
        run: |
          dotnet test tests/Weir.Tests/Weir.Tests.fsproj
          dotnet test tests/Weir.Tests/Weir.Tests.fsproj
      - name: publish (AOT) + freshness gate
        run: |
          ./publish.sh
          ./ci/check-fresh.sh
      # commit areas are DERIVED, not remembered [D:commit-areas]: every
      # PR commit's area prefix must equal what its diff touches. PR
      # titles keep the prefix too — the squash commit inherits it.
      # Forward-only; runs after publish because the check is a weir
      # script (the scripting policy's own dogfood).
      - name: commit-area check (PRs only)
        if: github.event_name == 'pull_request'
        run: ~/.local/bin/weir ci/commit-area.weir --range "${{ github.event.pull_request.base.sha }}..HEAD"
      # the decision index resolves [D:decision-keys]: every [D:key] in
      # src/, tests/ and the index itself names a real key-column row.
      # Linux only — it reads git ls-files. A weir script, like the
      # commit-area check above (the scripting policy's dogfood).
      - name: decision-key check
        run: ~/.local/bin/weir ci/decision-keys.weir
      # the tag-without-publish gate [D:release-gate]: fails LOUD if a
      # v* tag exists with no PUBLISHED release (releases/latest excludes
      # drafts, so the installers 404). Passes pre-first-release and once
      # the draft is published; red only in the tag->publish window,
      # which is the missing-publish-click surfacing itself.
      - name: release-published check
        run: ~/.local/bin/weir ci/release-published.weir

      - name: e2e battery (conflict-marker gate at its top)
        run: ./ci/e2e.sh
      - name: fuzz smoke (pinned seed)
        run: dotnet test tests/Weir.Fuzz/Weir.Fuzz.fsproj
      - name: doc-tests
        run: ./ci/skill-doc.sh
      # the message census [D:census-first-diagnostic]: a REGRESSION baseline,
      # so it has to run — it drifted 5 points unnoticed while nothing
      # invoked it, and the drift turned out to be the instrument
      # dead private bindings [D:drop-command-impls]: expected count zero —
      # assertable only since the retired command tier's impls went. Private
      # only; a dead PUBLIC binding is out of its reach.
      - name: dead-private check
        run: ~/.local/bin/weir tools/dead-privates.weir

      - name: message census
        run: ~/.local/bin/weir tools/dx-message-census.weir --bin ~/.local/bin/weir

      - name: F# oracle
        run: ./ci/fsharp-oracle.sh
      - name: timing
        run: ./ci/timing.sh

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-macos-${{ hashFiles('**/*.fsproj') }}
          restore-keys: nuget-macos-
      - name: unit suite (detailed logger — a hang localizes to the last printed test)
        timeout-minutes: 20
        run: dotnet test tests/Weir.Tests/Weir.Tests.fsproj --logger "console;verbosity=detailed"
      - name: publish (AOT) + freshness gate
        run: |
          ./publish.sh
          ./ci/check-fresh.sh
      - name: PyYAML — the interop referee runs here too (weir refereeing itself missed four emitter defects; doubling the referee's platforms is one line)
        run: python3 -m pip install --break-system-packages pyyaml || python3 -m pip install pyyaml
      - name: e2e battery — the GNU-ism sweep's real signal (reds are findings)
        run: ./ci/e2e.sh
      - name: doc-tests
        run: ./ci/skill-doc.sh
      - name: timing (advisory off-linux — the script states it)
        run: ./ci/timing.sh

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        # Git Bash: the one gate implementation runs unchanged — a .ps1
        # twin would be the same-policy-twice shape
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@v6
        with:
          path: ~\.nuget\packages
          key: nuget-windows-${{ hashFiles('**/*.fsproj') }}
          restore-keys: nuget-windows-
      - name: unit suite (stated skips expected — the Skipped count is the list)
        run: dotnet test tests/Weir.Tests/Weir.Tests.fsproj
      - name: publish (AOT, MSVC link) + freshness gate
        run: |
          pwsh -File ./publish.ps1
          WEIR_BIN="$LOCALAPPDATA/Programs/weir/weir.exe" ./ci/check-fresh.sh
      - name: e2e battery (HTTP is the one never-run-here surface — watch it)
        run: WEIR_BIN="$LOCALAPPDATA/Programs/weir/weir.exe" ./ci/e2e.sh
      - name: doc-tests
        run: WEIR_BIN="$LOCALAPPDATA/Programs/weir/weir.exe" ./ci/skill-doc.sh
      - name: timing (advisory off-linux — the script states it)
        run: WEIR_BIN="$LOCALAPPDATA/Programs/weir/weir.exe" ./ci/timing.sh
