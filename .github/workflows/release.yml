# Releases [D:releases] — a v* tag produces a DRAFT release carrying
# one bare binary per platform plus SHA256SUMS. THE GATE: the full
# battery runs first and nothing publishes if anything is red; the
# freshness gate runs strict (WEIR_REQUIRE_CLEAN=1 — a release never
# builds from a dirty tree) and the conflict-marker gate rides e2e.
# Draft-then-publish: a human sees the artifact list before it is
# public (it catches a missing platform).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-linux-${{ hashFiles('**/*.fsproj') }}
          restore-keys: nuget-linux-
      - name: AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: full battery — a release cannot publish from red
        run: |
          dotnet test tests/Weir.Tests/Weir.Tests.fsproj
          ./publish.sh
          WEIR_REQUIRE_CLEAN=1 ./ci/check-fresh.sh
          ./ci/e2e.sh
          dotnet test tests/Weir.Fuzz/Weir.Fuzz.fsproj
          ./ci/skill-doc.sh
          ./ci/fsharp-oracle.sh
          ./ci/timing.sh

  build:
    needs: gate
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: AOT prerequisites (linux)
        if: startsWith(matrix.rid, 'linux')
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: publish with the release stamp
        run: dotnet publish src/Weir -c Release -r ${{ matrix.rid }} -p:WeirRelease=${{ github.ref_name }}
      - name: the binary reports the tag — pinned by the job, not assumed
        run: |
          case "${{ matrix.rid }}" in
            win-*) BIN=src/Weir/bin/Release/net10.0/${{ matrix.rid }}/publish/Weir.exe ;;
            *)     BIN=src/Weir/bin/Release/net10.0/${{ matrix.rid }}/publish/Weir ;;
          esac
          v=$("$BIN" --version)
          case "$v" in
            "${{ github.ref_name }}"+*) echo "version: $v" ;;
            *) echo "RELEASE REFUSED: --version says '$v', tag is '${{ github.ref_name }}'"; exit 1 ;;
          esac
          case "${{ matrix.rid }}" in
            win-*) cp "$BIN" "weir-${{ github.ref_name }}-${{ matrix.rid }}.exe" ;;
            *)     cp "$BIN" "weir-${{ github.ref_name }}-${{ matrix.rid }}" ;;
          esac
      - uses: actions/upload-artifact@v6
        with:
          name: weir-${{ matrix.rid }}
          path: weir-${{ github.ref_name }}-*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: checksums — not optional
        run: cd dist && sha256sum weir-* > SHA256SUMS && cat SHA256SUMS
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --draft \
            --title "weir ${{ github.ref_name }}" \
            --notes "Draft — fill in what changed and WHAT BROKE (0.x breaks things; say so). Unsigned binaries: see docs/INSTALL.md for the macOS/Windows first-run steps." \
            dist/weir-* dist/SHA256SUMS
