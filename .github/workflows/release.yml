# Releases [D:releases] — a v* tag produces a DRAFT release carrying
# one bare binary per platform plus SHA256SUMS. THE GATE: the full
# battery runs first and nothing publishes if anything is red; the
# freshness gate runs strict (WEIR_REQUIRE_CLEAN=1 — a release never
# builds from a dirty tree) and the conflict-marker gate rides e2e.
# Draft-then-publish: a human sees the artifact list before it is
# public (it catches a missing platform).
name: release

on:
  push:
    tags: ["v[0-9]*"]  # never ext-vscode-v* / ext-zed-v* — and a v-junk tag stays inert

permissions:
  contents: write

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-linux-${{ hashFiles('**/*.fsproj') }}
          restore-keys: nuget-linux-
      - name: AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: full battery — a release cannot publish from red
        run: |
          dotnet test tests/Weir.Tests/Weir.Tests.fsproj
          ./publish.sh
          WEIR_REQUIRE_CLEAN=1 ./ci/check-fresh.sh
          ./ci/e2e.sh
          dotnet test tests/Weir.Fuzz/Weir.Fuzz.fsproj
          ./ci/skill-doc.sh
          ./ci/fsharp-oracle.sh
          ./ci/timing.sh
      # the tag-without-notes gate [D:changelog]: the release body is
      # extracted from CHANGELOG.md's `## <tag>` section (publish job), so
      # a tag with no section — or an empty one — must refuse HERE, before
      # any binary is built
      - name: changelog section exists for this tag
        run: ~/.local/bin/weir ci/changelog-check.weir --tag "${{ github.ref_name }}"
      # editor currency [D:grammar-currency] — release is when editor
      # users arrive, so the release asserts the split-out grammar and
      # the Zed pin are current. Red here is fixable BEFORE tagging:
      # refresh the grammar, push, re-run. Settles [D:ts-split]'s
      # deferred question with yes.
      - name: tree-sitter grammar is current
        run: ~/.local/bin/weir ci/grammar-currency.weir
      - name: zed rev + queries are current
        run: ~/.local/bin/weir ci/zed-rev-current.weir

  build:
    needs: gate
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
          # the free x86_64 label after macos-13's retirement; GitHub
          # drops Intel macOS entirely when macos-15 retires (Fall 2027)
          # — the platform sunsets with it
          - os: macos-15-intel
            rid: osx-x64
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
    runs-on: ${{ matrix.os }}
    # attestation needs OIDC + write to the attestation store; the build
    # job otherwise only reads the repo (publish holds contents: write)
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: AOT prerequisites (linux)
        if: startsWith(matrix.rid, 'linux')
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: publish with the release stamp
        run: dotnet publish src/Weir -c Release -r ${{ matrix.rid }} -p:WeirRelease=${{ github.ref_name }}
      - name: the binary reports the tag — pinned by the job, not assumed
        run: |
          case "${{ matrix.rid }}" in
            win-*) BIN=src/Weir/bin/Release/net10.0/${{ matrix.rid }}/publish/Weir.exe ;;
            *)     BIN=src/Weir/bin/Release/net10.0/${{ matrix.rid }}/publish/Weir ;;
          esac
          v=$("$BIN" --version)
          case "$v" in
            "${{ github.ref_name }}"+*) echo "version: $v" ;;
            *) echo "RELEASE REFUSED: --version says '$v', tag is '${{ github.ref_name }}'"; exit 1 ;;
          esac
          case "${{ matrix.rid }}" in
            win-*) cp "$BIN" "weir-${{ github.ref_name }}-${{ matrix.rid }}.exe" ;;
            *)     cp "$BIN" "weir-${{ github.ref_name }}-${{ matrix.rid }}" ;;
          esac
      # signed build provenance [D:install-checksum-scope]: the installer's
      # embedded checksum is the primary trust anchor; this adds an
      # independent, OIDC-signed record that THIS repo's Actions built the
      # binary, which `gh attestation verify` checks best-effort.
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: weir-${{ github.ref_name }}-*
      - uses: actions/upload-artifact@v7
        with:
          name: weir-${{ matrix.rid }}
          path: weir-${{ github.ref_name }}-*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: checksums — not optional
        run: cd dist && sha256sum weir-* > SHA256SUMS && cat SHA256SUMS
      # the PINNED installers [D:install-checksum-scope]: the just-built
      # release binary generates its own installer — gen-install.weir pins
      # this tag and embeds the SHA256SUMS above, so the script weir.sh
      # serves trusts checksums from a DIFFERENT origin than the binaries.
      # The repo install.sh/.ps1 are TEMPLATES; these dist/ copies are the
      # artifacts. weir.sh serves them from here (the site copies the
      # release assets); the repo templates are never fetched by users.
      - name: generate the pinned installers (the release binary makes its own)
        run: |
          BIN="dist/weir-${{ github.ref_name }}-linux-x64"
          chmod +x "$BIN"
          "$BIN" ci/gen-install.weir --template install.sh  --sums dist/SHA256SUMS --tag "${{ github.ref_name }}" --out dist/install.sh
          "$BIN" ci/gen-install.weir --template install.ps1 --sums dist/SHA256SUMS --tag "${{ github.ref_name }}" --out dist/install.ps1
          sh -n dist/install.sh
      # the release body IS the changelog section [D:changelog]: one
      # authored source, extracted here — the body cannot drift from the
      # repo. The gate job already proved the section exists and is
      # non-empty; the -s check is defense in depth, and the awk matches
      # the heading EXACTLY (the gate refuses stray whitespace for
      # precisely this agreement).
      - name: extract the release body from CHANGELOG.md
        run: |
          awk -v tag="## ${{ github.ref_name }}" '
            $0 == tag {hit=1; next}
            hit && /^## / {exit}
            hit {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "empty changelog section for ${{ github.ref_name }} — the gate should have caught this" >&2; exit 1; }
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --draft \
            --title "weir ${{ github.ref_name }}" \
            --notes-file notes.md \
            dist/weir-* dist/SHA256SUMS dist/install.sh dist/install.ps1 \
            editors/grammar-manifest.json
