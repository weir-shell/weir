# The nightly signal storm [D:storm-nightly] — scheduled, linux-only.
#
# ci/storm/storm.py sends INT/TERM/HUP/QUIT at random points into fixtures
# that nest scopes, fan-outs, races, locks, procs, serve, a backstop-adopted
# compute and a cleanup reading the terminal, and judges each run against
# the documented signal semantics (docs/reference/concurrency.md): the exit
# status, cleanups whole and once, nothing after a cut, no orphan, no tmp
# left, no core, a cooked terminal after a pty run. Storms: one signal,
# several, at a terminal, QUIT, group-directed (kill -- -pgid), and terminal
# keys with hangup (^C, ^\, closing the master). ci/storm/repl.py storms the
# tty REPL: a ^C into a many-statement entry (it ends with exit 130, nothing
# after runs, the session lives on), and TERM/HUP/hangup at its prompt or
# mid-entry. Unlike the review harnesses these GATE: every run must pass, so
# a red night is a finding — its failing run dirs are in the artifact. A
# run whose only issues are an open finding's prints as `known`, not bad.
# ci/storm/fuzz.py rides the same job: random fan-out/race trees against a
# discrete-event oracle.
#
# Sized for ~30 min on ubuntu-latest: --runs 30 per fixture per storm (10
# fixtures, ~2.5 min a storm at 3 jobs, six storms), 100 runs per REPL mode
# (~5 min both) and 500 fuzz trees (~3 min), beside the AOT publish. Raise
# them on a workflow_dispatch for resolution.
name: storm

on:
  schedule:
    - cron: "29 2 * * *"
  workflow_dispatch:
    inputs:
      runs:
        description: "runs per fixture per storm"
        default: "30"
      count:
        description: "signals per run in the multi-signal storm (N or A-B)"
        default: "2-3"
      tty:
        description: "run the --tty storm"
        type: boolean
        default: true
      trees:
        description: "race-tree fuzzer trees"
        default: "500"
      repl_runs:
        description: "runs per REPL storm mode"
        default: "100"

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  RUNS: ${{ inputs.runs || '30' }}
  COUNT: ${{ inputs.count || '2-3' }}
  TREES: ${{ inputs.trees || '500' }}
  REPL_RUNS: ${{ inputs.repl_runs || '100' }}

jobs:
  storm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-linux-${{ hashFiles('**/*.fsproj') }}
          restore-keys: nuget-linux-
      - name: AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: publish (AOT) + freshness gate
        id: publish
        run: |
          ./publish.sh
          ./ci/check-fresh.sh
      # each storm draws its serve ports from its own 500-port block below
      # the ephemeral range [D:harness-ports]; every step runs even after a
      # red one, so one night reports them all
      - name: storm, one signal
        env:
          STORM_PORT0: "20000"
        run: python3 -I ci/storm/storm.py --bin ~/.local/bin/weir --out "$RUNNER_TEMP/storm/single" --runs "$RUNS" --jobs 3 --count 1
      - name: storm, several signals
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        env:
          STORM_PORT0: "20500"
        run: python3 -I ci/storm/storm.py --bin ~/.local/bin/weir --out "$RUNNER_TEMP/storm/multi" --runs "$RUNS" --jobs 3 --count "$COUNT"
      - name: storm, at a terminal
        if: ${{ !cancelled() && steps.publish.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.tty) }}
        env:
          STORM_PORT0: "21000"
        run: python3 -I ci/storm/storm.py --bin ~/.local/bin/weir --out "$RUNNER_TEMP/storm/tty" --runs "$RUNS" --jobs 3 --count 1-3 --tty
      - name: storm, SIGQUIT
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        env:
          STORM_PORT0: "21500"
        run: python3 -I ci/storm/storm.py --bin ~/.local/bin/weir --out "$RUNNER_TEMP/storm/quit" --runs "$RUNS" --jobs 3 --count 1 --kinds QUIT
      - name: storm, group-directed
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        env:
          STORM_PORT0: "22000"
        run: python3 -I ci/storm/storm.py --bin ~/.local/bin/weir --out "$RUNNER_TEMP/storm/group" --runs "$RUNS" --jobs 3 --count 1 --group --kinds TERM,HUP
      - name: storm, terminal keys and hangup
        if: ${{ !cancelled() && steps.publish.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.tty) }}
        env:
          STORM_PORT0: "22500"
        run: python3 -I ci/storm/storm.py --bin ~/.local/bin/weir --out "$RUNNER_TEMP/storm/ttykeys" --runs "$RUNS" --jobs 3 --count 1-2 --tty --kinds INT,QUIT,HANGUP
      - name: REPL storm, ^C
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        run: python3 -I ci/storm/repl.py --bin ~/.local/bin/weir --out "$RUNNER_TEMP/storm/repl-int" --runs "$REPL_RUNS" --jobs 3 --mode int
      - name: REPL storm, TERM/HUP/hangup
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        run: python3 -I ci/storm/repl.py --bin ~/.local/bin/weir --out "$RUNNER_TEMP/storm/repl-kill" --runs "$REPL_RUNS" --jobs 3 --mode kill
      - name: race-tree fuzzer
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        run: python3 -I ci/storm/fuzz.py --bin ~/.local/bin/weir --out "$RUNNER_TEMP/storm/fuzz" --trees "$TREES" --jobs 3
      # a report, never a gate [D:sig-sources]: `weir add sig` against the
      # runner's installed tools, scored on tests/sigs/live — versions drift
      - name: command signatures, live report (not a gate)
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/storm"
          ~/.local/bin/weir tools/sig-score.weir --bin ~/.local/bin/weir --live | tee "$RUNNER_TEMP/storm/sig-live.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: storm-results
          path: ${{ runner.temp }}/storm
          if-no-files-found: warn
          retention-days: 14
