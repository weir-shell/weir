id = "weir"
name = "Weir"
description = "Weir language support: diagnostics, hover, completion, formatting, go-to-definition via `weir lsp`; tree-sitter highlighting"
version = "0.1.0"
schema_version = 1
authors = ["queil"]
repository = "https://github.com/weir-shell/weir"

[language_servers.weir]
name = "weir"
languages = ["Weir"]

# The grammar lives in its own repo (Zed clones a grammar from a repo
# ROOT). REV RITUAL: bumping this rev and refreshing
# languages/weir/highlights.scm are ONE motion — copy the queries
# from the SAME grammar commit the rev pins. The ritual is CHECKED, not
# just stated [D:grammar-currency]: ci/zed-rev-current.weir asserts the
# rev is the grammar's current main AND every queried node exists at
# this rev — at release and on the weekly schedule.
[grammars.weir]
repository = "https://github.com/weir-shell/tree-sitter-weir"
rev = "2e17691"
